function groupBy(arr,key){return arr.reduce((a,i)=>{const g=i[key]||"Other";if(!a[g])a[g]=[];a[g].push(i);return a;},{});}

function isLocked(item, selectedSet){
  if(item.requires) return !selectedSet.has(item.requires);
  if(item.requiresAny) return !item.requiresAny.some(r=>selectedSet.has(r));
  return false;
}

const S={
  page:{minHeight:"100vh",background:"#121212",fontFamily:"'Segoe UI',system-ui,sans-serif",color:"#e4e6eb",maxWidth:680,margin:"0 auto"},
  hdr:{background:"linear-gradient(135deg,#1a1a1a 0%,#2a2a2a 100%)",padding:"18px 14px 0",borderBottom:"1px solid rgba(126,184,201,0.1)"},
  content:{padding:"12px 12px 80px"},
};

function QtyInput({value,onChange,maxQty}){
  const mx=maxQty||20;
  return <input type="number" min={1} max={mx} value={value}
    onChange={e=>onChange(Math.max(1,Math.min(mx,parseInt(e.target.value)||1)))}
    onClick={e=>e.stopPropagation()}
    style={{width:44,marginLeft:8,padding:"2px 6px",background:"#2a2a2a",border:"1px solid #7eb8c9",color:"#7eb8c9",borderRadius:4,fontSize:13,textAlign:"center"}}/>;
}

function ToggleRow({label,cpt,selected,onToggle,qty,onQtyChange,hasQty,note,maxQty,locked,lockMsg}){
  return(
    <div onClick={locked?undefined:onToggle} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 12px",marginBottom:4,borderRadius:8,cursor:locked?"not-allowed":"pointer",userSelect:"none",
      opacity:locked?0.38:1,
      background:selected?"rgba(126,184,201,0.1)":"rgba(255,255,255,0.03)",
      border:selected?"1px solid rgba(126,184,201,0.3)":locked?"1px solid rgba(255,255,255,0.03)":"1px solid rgba(255,255,255,0.03)"}}>
      <div style={{width:20,height:20,borderRadius:4,flexShrink:0,marginTop:1,
        background:selected?"#7eb8c9":"transparent",border:selected?"2px solid #7eb8c9":"2px solid #4b5563",
        display:"flex",alignItems:"center",justifyContent:"center"}}>
        {selected&&<span style={{color:"#121212",fontSize:13,fontWeight:700}}>✓</span>}
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:"flex",alignItems:"center",flexWrap:"wrap",gap:6}}>
          <span style={{fontSize:13,color:selected?"#e4e6eb":"#9aa0a6",lineHeight:1.4}}>{label}</span>
          {hasQty&&selected&&<QtyInput value={qty||1} onChange={onQtyChange} maxQty={maxQty}/>}
        </div>
        {cpt&&<div style={{fontSize:11,color:"#7eb8c9",marginTop:2,fontFamily:"monospace"}}>{cpt}</div>}
        {note&&selected&&<div style={{fontSize:11,color:"#c8923a",marginTop:3}}>⚠ {note}</div>}
        {locked&&<div style={{fontSize:10,color:"#6b7280",marginTop:2,fontStyle:"italic"}}>🔒 {lockMsg||"Select initial code first"}</div>}
      </div>
    </div>
  );
}

  return(
    <button onClick={onClear} style={{width:"100%",padding:"11px",marginBottom:14,borderRadius:8,
      border:"1px solid rgba(192,57,43,0.35)",background:"rgba(192,57,43,0.08)",
      color:"#c0392b",fontWeight:700,fontSize:12,cursor:"pointer"}}>
      🗑 CLEAR ALL SELECTIONS IN THIS TAB
    </button>
  );
}

function App(){
  const [tab,setTab]=useState(0);
  const [info,setInfo]=useState({date:new Date().toISOString().split('T')[0],provider:"",caseNum:"1"});
  const [selBase,setSelBase]=useState(new Set());
  const [selAngios,setSelAngios]=useState(new Set());
  const [selInt,setSelInt]=useState(new Set());
  const [selAccess,setSelAccess]=useState(new Set());
  const [selMods,setSelMods]=useState(new Set());
  const [qty,setQty]=useState({});
  const [showReset,setShowReset]=useState(false);
  const [intSearch,setIntSearch]=useState("");
  const [copied,setCopied]=useState(false);

  const tog=(fn,id,allItems,otherFn)=>{
    fn(p=>{
      const n=new Set(p);
      if(n.has(id)){
        n.delete(id);
        // auto-deselect any add-ons that require this id
        if(allItems) allItems.forEach(item=>{
          if(item.requires===id||(item.requiresAny&&item.requiresAny.includes(id)&&item.requiresAny.every(r=>r===id||!n.has(r)))){
            n.delete(item.id);
          }
        });
      } else { n.add(id); }
      return n;
    });
  };
  const getQ=(k,d=1)=>qty[k]||d;
  const setQ=(k,v)=>setQty(p=>({...p,[k]:v}));

  const clearAngioGroup=(group)=>{
    const ids=ANGIO_BUTTONS.filter(b=>b.group===group).map(b=>b.id);
    setSelAngios(prev=>{const n=new Set(prev);ids.forEach(id=>n.delete(id));return n;});
  };
  const clearIntGroup=(group)=>{
    const ids=INTERVENTIONS.filter(c=>c.group===group).map(c=>c.id);
    setSelInt(prev=>{const n=new Set(prev);ids.forEach(id=>n.delete(id));return n;});
  };
  const newCase=()=>{
    setSelBase(new Set());setSelAngios(new Set());setSelInt(new Set());
    setSelAccess(new Set());setSelMods(new Set());setQty({});
    setInfo({date:"",provider:"",caseNum:"1"});setShowReset(false);setTab(0);
  };

  const buildSummary=()=>{
    const raw=[];
    BASE_CODES.filter(c=>selBase.has(c.id)).forEach(c=>raw.push({cpt:c.cpt,desc:c.label,qty:1,sec:"Base Catheterization"}));
    ANGIO_BUTTONS.filter(b=>selAngios.has(b.id)).forEach(b=>{
      b.codes.forEach((c,i)=>{
        const q=c.hasQty?getQ(b.id+"_"+i,c.qty||1):(c.qty||1);
        raw.push({cpt:c.cpt,desc:"["+b.label+"] "+c.desc,qty:q,sec:"Angiography"});
      });
    });
    INTERVENTIONS.filter(c=>selInt.has(c.id)).forEach(c=>raw.push({cpt:c.cpt,desc:c.label,qty:c.hasQty?getQ(c.id):1,sec:c.group}));
    ACCESS_CODES.filter(c=>selAccess.has(c.id)).forEach(c=>raw.push({cpt:c.cpt,desc:c.label,qty:1,sec:"Vascular Access"}));

    // DEDUPLICATION — merge same CPT codes, combine quantities
    // Codes that legitimately stack (multiple vessels) vs codes that should never duplicate
    const STACKABLE=new Set(["36014","36015","36218","75774-26","75820-26","75710-26","75716-26","93568","36011","36012","36013","93598-26","93463"]);
    const merged={};
    const order=[];
    raw.forEach(l=>{
      const base=l.cpt.replace(/-26$/,"");
      const key=l.cpt;
      if(merged[key]){
        if(STACKABLE.has(key)||STACKABLE.has(base)){
          merged[key].qty+=l.qty;
          // Append label if different
          if(!merged[key].desc.includes(l.desc)&&l.desc!==merged[key].desc){
            merged[key].desc=merged[key].desc+" + "+l.desc.replace(/^\[.*?\] /,"");
          }
        }
        // Non-stackable: keep first, skip duplicate
      } else {
        merged[key]={...l};
        order.push(key);
      }
    });
    return order.map(k=>merged[k]);
  };

  // BUNDLING WARNINGS
  const getBundlingWarnings=()=>{
    const warns=[];
    const selIntArr=[...selInt];
    const selBaseArr=[...selBase];
    const selAngiosArr=[...selAngios];
    const selAccessArr=[...selAccess];
    const allCpts=new Set(summary.map(l=>l.cpt));

    // ASD/PFO/VSD closure includes diagnostic cath + atrial/ventricular angio
    if(selIntArr.some(id=>["asd_closure","vsd_closure"].includes(id))){
      if(selBaseArr.some(id=>["rh_normal","rh_abnormal","rlh_normal","rlh_abnormal","lh_only"].includes(id))){
        warns.push({
          level:"error",
          msg:"ASD/PFO/VSD closure includes diagnostic R+L heart cath and atrial/ventricular angiography — remove base cath code.",
          ok:"You MAY still bill: 93563 (coronary), 93567 (supravalvar aortogram), 93568 (pulmonary arteriogram)"
        });
      }
      if(selAngiosArr.some(id=>["fontan_ra_angio","ra_pa_angio","rv_angio","rv_pa_angio","lv_angio"].includes(id))){
        warns.push({
          level:"error",
          msg:"ASD/PFO/VSD closure includes atrial and ventricular angiography — remove RA/RV/LV angiogram buttons.",
          ok:"You MAY still bill: 93563, 93567, 93568"
        });
      }
    }

    // PDA closure includes R+L heart cath and aortic angiography
    if(selInt.has("pda_closure")){
      if(selBaseArr.some(id=>["rh_normal","rh_abnormal","rlh_normal","rlh_abnormal","lh_only"].includes(id))){
        warns.push({
          level:"error",
          msg:"PDA closure (93582) includes R+L heart cath — remove base cath code.",
          ok:"You MAY still bill: 93568 (pulmonary arteriogram)"
        });
      }
      if(selAngiosArr.some(id=>["ascending_aorta","transverse_arch","descending_aorta","full_aorta"].includes(id))){
        warns.push({
          level:"error",
          msg:"PDA closure (93582) includes aortic angiography — remove aortic angiogram selection.",
          ok:"You MAY still bill: 93568 (pulmonary arteriogram)"
        });
      }
    }

    // Coarctation stent includes left heart cath and pacing
    if(selIntArr.some(id=>["coarc_stent_cross","coarc_stent_no"].includes(id))){
      if(selBaseArr.some(id=>["rlh_normal","rlh_abnormal","lh_only","lh_acquired","rlh_acquired"].includes(id))){
        warns.push({
          level:"error",
          msg:"Coarctation stent (33894/33895) includes left heart cath and pacing — remove left heart cath base code.",
          ok:"Right heart cath is OK to bill separately if performed"
        });
      }
    }

    // Covered stent for aortic injury
    if(selInt.has("covered_cross")||selInt.has("covered_no")){
      warns.push({
        level:"info",
        msg:"Covered stent for aortic injury: angiography (75957) is separately billable. If surgeon provides open access, they report 34714 separately.",
        ok:""
      });
    }

    // US vascular access bundled into congenital cath
    if(selAccess.has("us_access")){
      if(selBaseArr.some(id=>["rh_normal","rh_abnormal","rlh_normal","rlh_abnormal"].includes(id))){
        warns.push({
          level:"warning",
          msg:"76937 (US-guided vascular access) is bundled into congenital cath codes and may not be separately billable.",
          ok:"Document US use, vessel size, and store image if billing this separately"
        });
      }
    }

    // PA angioplasty max 7 branches
    const paAngioQty=getQ("pa_angio_add");
    if(selInt.has("pa_angio_add")&&paAngioQty>6){
      warns.push({
        level:"warning",
        msg:"PA angioplasty add-on (92998): maximum 7 total branches per session (initial + additional). Check quantity.",
        ok:""
      });
    }

    // Hybrid stent reminder
    if(selInt.has("hybrid_stent")){
      warns.push({
        level:"info",
        msg:"Hybrid stent (33621): bill as 33621-62 + 37236 + angiography. Add 93567/93568 if diagnostics performed. Surgeon reports 33620-62 + 33621 separately.",
        ok:""
      });
    }

    // Pulmonary valve replacement reminder
    if(selInt.has("tpvr")){
      warns.push({
        level:"info",
        msg:"TPVR (33477): diagnostic cath billable only if no prior study available or new diagnostic condition exists. Other distinct interventions OK if justified in documentation.",
        ok:""
      });
    }

    // Atrial septostomy — diagnostics NOT bundled (good news)
    if(selInt.has("atrial_septostomy")){
      warns.push({
        level:"info",
        msg:"Atrial septostomy (33741): diagnostic cath and angiography are NOT included — bill them separately as appropriate.",
        ok:""
      });
    }

    return warns;
  };

  const summary=buildSummary();
  const activeMods=MODIFIERS.filter(m=>selMods.has(m.id));
  const angiGroups=groupBy(ANGIO_BUTTONS,"group");
  const intGroups=groupBy(INTERVENTIONS,"group");
  const badge=i=>[selBase.size,selAngios.size,selInt.size,selAccess.size,summary.length,0][i]||0;

  const getWrvu=(cpt)=>{
    // Try exact match first, then strip -26 for codes that only exist globally
    const val=WRVU[cpt];
    if(val!==undefined) return val;
    // Try base code without modifier
    const base=cpt.replace(/-26$/,'');
    return WRVU[base]||0;
  };

  const totalWrvu=summary.reduce((sum,l)=>{
    const rv=getWrvu(l.cpt);
    return sum+rv*(l.qty||1);
  },0);

  const doCopy=()=>{
    const hdr="CARDIAC CATH CHARGE CAPTURE\n"+"-".repeat(48)+"\nDate: "+(info.date||"___")+"  |  Provider: "+(info.provider||"___")+"  |  Case #"+info.caseNum+"\n"+"-".repeat(48)+"\n";
    const mLine=activeMods.length?"\nMODIFIERS: "+activeMods.map(m=>"-"+m.code+" ("+m.label+")").join(", ")+"\n":"";
    const secs={};
    summary.forEach(l=>{if(!secs[l.sec])secs[l.sec]=[];secs[l.sec].push("  "+l.cpt+(l.qty>1?" x"+l.qty:"")+"  |  "+l.desc);});
    const body=Object.entries(secs).map(([s,ls])=>"\n"+s.toUpperCase()+"\n"+ls.join("\n")).join("\n");
    const text=hdr+mLine+body+"\n\n"+"-".repeat(48)+"\nTOTAL CODES: "+summary.length;
    navigator.clipboard.writeText(text).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
  };

  const doPrint=()=>{
    const secs={};
    summary.forEach(l=>{if(!secs[l.sec])secs[l.sec]=[];secs[l.sec].push(l);});
    const mLine=activeMods.length?"MODIFIERS: "+activeMods.map(m=>"-"+m.code+" ("+m.label+")").join(", "):"";
    const displayDate=info.date?new Date(info.date+"T12:00:00").toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"}):info.date||"___";
    let sections="";
    Object.entries(secs).forEach(([s,ls])=>{
      sections+="<div style='margin-bottom:18px'>";
      sections+="<div style='font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#2a2a2a;border-bottom:2px solid #2a2a2a;padding-bottom:4px;margin-bottom:8px'>"+s+"</div>";
      ls.forEach(l=>{
        sections+="<div style='display:flex;gap:16px;padding:5px 0;border-bottom:1px solid #eee;align-items:baseline'>";
        sections+="<div style='font-family:Courier New,monospace;font-weight:700;font-size:13px;color:#1a1a1a;min-width:110px;flex-shrink:0'>"+l.cpt+(l.qty>1?" ×"+l.qty:"")+"</div>";
        sections+="<div style='font-size:12px;color:#333;flex:1'>"+l.desc+"</div>";
        sections+="</div>";
      });
      sections+="</div>";
    });
    const printHTML="<!DOCTYPE html><html><head><meta charset='UTF-8'>"+
      "<meta name='viewport' content='width=device-width,initial-scale=1'>"+
      "<title>Cath Charges - "+(info.provider||"")+" - "+displayDate+"</title>"+
      "<style>"+
      "body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:24px;background:white;color:#111;max-width:720px;margin:0 auto;}"+
      "@media print{body{padding:16px;} .no-print{display:none!important;} @page{margin:1cm;}}"+
      "h1{font-size:20px;font-weight:700;margin:0;}"+
      ".subtitle{font-size:12px;color:#555;margin-top:2px;}"+
      ".header-block{border-bottom:3px solid #1a1a1a;padding-bottom:14px;margin-bottom:16px;}"+
      ".meta{display:flex;gap:24px;margin-bottom:16px;font-size:13px;background:#f0f6ff;padding:10px 14px;border-radius:6px;}"+
      ".meta b{color:#1a1a1a;}"+
      ".modifier-box{background:#1e1a0e;border:1px solid #8a7000;padding:8px 14px;margin-bottom:16px;border-radius:5px;font-size:12px;font-weight:600;color:#6b5010;}"+
      ".footer{margin-top:24px;padding-top:12px;border-top:2px solid #1a1a1a;display:flex;justify-content:space-between;font-size:12px;color:#555;}"+
      ".print-btn{display:block;width:100%;padding:14px;background:#1a1a1a;color:white;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:20px;letter-spacing:0.03em;}"+
      ".share-hint{font-size:12px;color:#666;text-align:center;margin-bottom:20px;}"+
      "</style></head><body>"+
      "<div class='no-print' style='display:flex;gap:10px;margin-bottom:16px'>"+
      "<button onclick='window.close()' style='flex:1;padding:13px;background:#2a2a2a;color:#9aa0a6;border:1px solid #2a2a2a;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer'>← Back to App</button>"+
      "<button onclick='window.print()' style='flex:2;padding:13px;background:#1a1a1a;color:white;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer'>🖨 Print / Save as PDF</button>"+
      "</div>"+
      "<div class='share-hint no-print'>On iPhone: tap the Share button in Safari to Email, Message, or Save as PDF</div>"+
      "<div class='header-block'>"+
      "<h1>Cardiac Cath Charge Capture</h1>"+
      "<div class='subtitle'>Congenital / Pediatric Cardiac Catheterization</div>"+
      "</div>"+
      "<div class='meta'>"+
      "<div><b>Date:</b> "+displayDate+"</div>"+
      "<div><b>Provider:</b> "+(info.provider||"___")+"</div>"+
      "<div><b>Case:</b> #"+info.caseNum+"</div>"+
      "</div>"+
      (mLine?"<div class='modifier-box'>"+mLine+"</div>":"")+
      sections+
      "<div class='footer'>"+
      "<span><b>Total CPT codes: "+summary.length+"</b></span>"+
      "<span>Generated: "+new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"})+"</span>"+
      "</div></body></html>";
    const win=window.open("","_blank");
    if(win){win.document.write(printHTML);win.document.close();}
    else{alert("Please allow pop-ups for this site, then try again.");}
  };

  return(
    <div style={S.page}>
      {/* HEADER */}
      <div style={S.hdr}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
          <div style={{width:34,height:34,borderRadius:8,background:"linear-gradient(135deg,#7eb8c9,#4a6fa5)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,flexShrink:0}}>❤</div>
          <div style={{flex:1}}>
            <div style={{fontSize:15,fontWeight:700}}>Cath Lab Charge Capture</div>
            <div style={{fontSize:10,color:"#6b7280"}}>Congenital / Pediatric Cardiac Catheterization</div>
          <div style={{fontSize:9,color:"#2a2a2a",marginTop:2}}>© 2026 Subhrajit Lahiri MD — All Rights Reserved</div>
          </div>
          {!showReset
            ?<button onClick={()=>setShowReset(true)} style={{fontSize:11,color:"#c8923a",background:"rgba(180,120,40,0.12)",border:"1px solid rgba(180,120,40,0.3)",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontWeight:700,whiteSpace:"nowrap"}}>+ New Case</button>
            :<div style={{display:"flex",gap:6}}>
              <button onClick={newCase} style={{fontSize:11,color:"white",background:"#c0392b",border:"none",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontWeight:700}}>Confirm Reset</button>
              <button onClick={()=>setShowReset(false)} style={{fontSize:11,color:"#9aa0a6",background:"#0f172a",border:"none",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontWeight:700}}>Cancel</button>
            </div>
          }
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 80px",gap:6,marginBottom:12}}>
          {[["date","Procedure Date"],["provider","Provider"]].map(([f,ph])=>(
            <input key={f} type={f==="date"?"date":"text"} placeholder={ph} value={info[f]} onChange={e=>setInfo(p=>({...p,[f]:e.target.value}))}
              style={{background:"#0f172a",border:"1px solid #2a2a2a",borderRadius:6,padding:"7px 10px",color:"#e4e6eb",fontSize:12,outline:"none",colorScheme:"dark"}}/>
          ))}
          <select value={info.caseNum} onChange={e=>setInfo(p=>({...p,caseNum:e.target.value}))}
            style={{background:"#0f172a",border:"1px solid #2a2a2a",borderRadius:6,padding:"7px 8px",color:"#e4e6eb",fontSize:12,outline:"none"}}>
            <option value="1">Case 1</option>
            <option value="2">Case 2</option>
          </select>
        </div>
        <div style={{display:"flex",gap:1,overflowX:"auto"}}>
          {TABS.map((t,i)=>{
            const b=badge(i);
            return(
              <button key={t} onClick={()=>setTab(i)} style={{padding:"7px 11px",fontSize:11,fontWeight:600,border:"none",borderRadius:"6px 6px 0 0",cursor:"pointer",whiteSpace:"nowrap",
                background:tab===i?"#121212":"transparent",color:tab===i?"#7eb8c9":"#6b7280",
                borderBottom:tab===i?"2px solid #7eb8c9":"2px solid transparent"}}>
                {t}{b>0&&<span style={{marginLeft:4,background:i===4?"#4a9e6b":"#7eb8c9",color:"#121212",borderRadius:10,fontSize:9,fontWeight:700,padding:"1px 4px"}}>{b}</span>}
              </button>
            );
          })}
        </div>
      </div>

      <div style={S.content}>

        {/* BASE CATH */}
        {tab===0&&(
          <div>
            {(selBase.size>0||selMods.size>0)&&<ClearAllBar onClear={()=>{setSelBase(new Set());setSelMods(new Set());}}/>}
            <SecHead title="Base Catheterization Code (select one)" onClear={()=>setSelBase(new Set())} count={selBase.size}/>
            <div style={{fontSize:11,color:"#6b7280",marginBottom:8}}>This anchors all add-on angiography codes.</div>
            {BASE_CODES.map(c=><ToggleRow key={c.id} label={c.label} cpt={c.cpt} selected={selBase.has(c.id)} onToggle={()=>tog(setSelBase,c.id)}/>)}
            <SecHead title="Modifiers" onClear={()=>setSelMods(new Set())} count={selMods.size}/>
            <div style={{fontSize:11,color:"#6b7280",marginBottom:8}}>Apply to relevant codes in summary.</div>
            {MODIFIERS.map(m=><ToggleRow key={m.id} label={"Modifier -"+m.code+" — "+m.label} note={m.note} cpt={"-"+m.code} selected={selMods.has(m.id)} onToggle={()=>tog(setSelMods,m.id)}/>)}
          </div>
        )}

        {/* ANGIOS */}
        {tab===1&&(
          <div>
            <div style={{fontSize:11,color:"#6b7280",marginBottom:10}}>Each button auto-selects catheter placement + S&I. -26 modifier pre-applied to all S&I codes.</div>
            {selAngios.size>0&&<ClearAllBar onClear={()=>setSelAngios(new Set())}/>}
            {Object.entries(angiGroups).map(([g,btns])=>{
              const gc=btns.filter(b=>selAngios.has(b.id)).length;
              return(
                <div key={g}>
                  <SecHead title={g} onClear={()=>clearAngioGroup(g)} count={gc}/>
                  {btns.map(btn=>{const lk=isLocked(btn,selAngios);return(<ClinicalButton key={btn.id} btn={btn} selected={selAngios.has(btn.id)} onToggle={id=>tog(setSelAngios,id,ANGIO_BUTTONS)} quantities={qty} onQtyChange={setQ} locked={lk}/>);})}
                </div>
              );
            })}
          </div>
        )}

        {/* INTERVENTIONS */}
        {tab===2&&(
          <div>
            <div style={{position:"sticky",top:0,zIndex:10,background:"#121212",paddingBottom:10,paddingTop:4}}>
              <div style={{position:"relative"}}>
                <span style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",fontSize:14,color:"#4b5563",pointerEvents:"none"}}>🔍</span>
                <input placeholder="Search interventions... (e.g. PA stent, coarc, ASD)" value={intSearch} onChange={e=>setIntSearch(e.target.value)}
                  style={{width:"100%",boxSizing:"border-box",padding:"10px 36px 10px 34px",background:"#0f172a",border:"1px solid rgba(126,184,201,0.2)",borderRadius:9,color:"#e4e6eb",fontSize:13,outline:"none"}}/>
                {intSearch&&<button onClick={()=>setIntSearch("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#6b7280",fontSize:16,cursor:"pointer",padding:0}}>✕</button>}
              </div>
              {intSearch&&<div style={{fontSize:10,color:"#6b7280",marginTop:4,paddingLeft:2}}>{INTERVENTIONS.filter(c=>(c.label+c.cpt+c.group).toLowerCase().includes(intSearch.toLowerCase())).length} results</div>}
            </div>
            {selInt.size>0&&!intSearch&&<ClearAllBar onClear={()=>setSelInt(new Set())}/>}
            {intSearch?(()=>{
              const q=intSearch.toLowerCase();
              const results=INTERVENTIONS.filter(c=>(c.label+c.cpt+c.group).toLowerCase().includes(q));
              if(!results.length) return <div style={{textAlign:"center",color:"#4b5563",padding:"30px 0",fontSize:13}}>No results for "{intSearch}"</div>;
              return results.map(c=>(
                <div key={c.id}>
                  <div style={{fontSize:9,color:"#4b5563",marginBottom:2,paddingLeft:2,letterSpacing:"0.08em",textTransform:"uppercase"}}>{c.group}</div>
                  {(()=>{const lk=isLocked(c,selInt);return <ToggleRow key={c.id} label={c.label} cpt={c.cpt} selected={selInt.has(c.id)} onToggle={()=>tog(setSelInt,c.id,INTERVENTIONS)} hasQty={c.hasQty} qty={getQ(c.id)} onQtyChange={v=>setQ(c.id,v)} maxQty={c.maxQty} locked={lk} lockMsg="Select initial code first"/>;})()}
                </div>
              ));
            })()
            :Object.entries(intGroups).map(([g,items])=>{
              const gc=items.filter(c=>selInt.has(c.id)).length;
              return(
                <div key={g}>
                  <SecHead title={g} onClear={()=>clearIntGroup(g)} count={gc}/>
                  {items.map(c=>{const lk=isLocked(c,selInt);return <ToggleRow key={c.id} label={c.label} cpt={c.cpt} selected={selInt.has(c.id)} onToggle={()=>tog(setSelInt,c.id,INTERVENTIONS)} hasQty={c.hasQty} qty={getQ(c.id)} onQtyChange={v=>setQ(c.id,v)} maxQty={c.maxQty} locked={lk} lockMsg={c.requires?"Select initial code first":c.requiresAny?"Select any initial code first":undefined}/>;})}
                </div>
              );
            })}
          </div>
        )}

        {/* ACCESS */}
        {tab===3&&(
          <div>
            {selAccess.size>0&&<ClearAllBar onClear={()=>setSelAccess(new Set())}/>}
            <SecHead title="Vascular Access" onClear={()=>setSelAccess(new Set())} count={selAccess.size}/>
            {ACCESS_CODES.map(c=><ToggleRow key={c.id} label={c.label} cpt={c.cpt} selected={selAccess.has(c.id)} onToggle={()=>tog(setSelAccess,c.id)}/>)}
          </div>
        )}

        {/* SUMMARY */}
        {tab===4&&(
          <div>
            {summary.length===0
              ?<div style={{textAlign:"center",color:"#4b5563",padding:"40px 0",fontSize:13}}>No codes selected. Go back and select procedures.</div>
              :<>
                <div style={{background:"rgba(15,39,68,0.8)",border:"1px solid rgba(126,184,201,0.12)",borderRadius:9,padding:"10px 14px",marginBottom:12}}>
                  <div style={{fontSize:11,color:"#6b7280"}}>Date: <span style={{color:"#e4e6eb"}}>{info.date||"—"}</span> &nbsp;|&nbsp; Provider: <span style={{color:"#e4e6eb"}}>{info.provider||"—"}</span> &nbsp;|&nbsp; Case <span style={{color:"#e4e6eb"}}>#{info.caseNum}</span></div>
                </div>
                {(()=>{
                  const warns=getBundlingWarnings();
                  if(!warns.length) return null;
                  const colors={error:{bg:"rgba(192,57,43,0.12)",border:"rgba(192,57,43,0.35)",icon:"🚫",title:"Billing Conflict",col:"#c0392b"},warning:{bg:"rgba(180,120,40,0.12)",border:"rgba(245,158,11,0.4)",icon:"⚠",title:"Warning",col:"#d4a85a"},info:{bg:"rgba(126,184,201,0.07)",border:"rgba(126,184,201,0.15)",icon:"ℹ",title:"Note",col:"#7eb8c9"}};
                  return(
                    <div style={{marginBottom:12}}>
                      {warns.map((w,i)=>{
                        const c=colors[w.level];
                        return(
                          <div key={i} style={{background:c.bg,border:"1px solid "+c.border,borderRadius:8,padding:"10px 12px",marginBottom:6}}>
                            <div style={{fontSize:12,fontWeight:700,color:c.col,marginBottom:3}}>{c.icon} {c.title}</div>
                            <div style={{fontSize:11,color:"#e4e6eb",lineHeight:1.5}}>{w.msg}</div>
                            {w.ok&&<div style={{fontSize:11,color:"#4a9e6b",marginTop:4}}>✓ {w.ok}</div>}
                          </div>
                        );
                      })}
                    </div>
                  );
                })()}
                {activeMods.length>0&&(
                  <div style={{background:"rgba(180,120,40,0.12)",border:"1px solid rgba(180,120,40,0.3)",borderRadius:8,padding:"9px 13px",marginBottom:10}}>
                    <div style={{fontSize:10,fontWeight:700,color:"#c8923a",marginBottom:3}}>MODIFIERS APPLIED</div>
                    {activeMods.map(m=><div key={m.id} style={{fontSize:12,color:"#d4a85a"}}>-{m.code} {m.label} — <span style={{color:"#7a5a20"}}>{m.note}</span></div>)}
                  </div>
                )}
                {(()=>{
                  const secs={};
                  summary.forEach(l=>{if(!secs[l.sec])secs[l.sec]=[];secs[l.sec].push(l);});
                  return Object.entries(secs).map(([s,ls])=>(
                    <div key={s}>
                      <SecHead title={s}/>
                      {ls.map((l,i)=>(
                        <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 11px",marginBottom:3,borderRadius:7,background:"#0f172a",border:"1px solid #2a2a2a"}}>
                          <span style={{fontFamily:"monospace",fontSize:12,fontWeight:700,color:"#7eb8c9",minWidth:88}}>{l.cpt}{l.qty>1?" x"+l.qty:""}</span>
                          <span style={{fontSize:11,color:"#9aa0a6",flex:1}}>{l.desc}</span>
                        </div>
                      ))}
                    </div>
                  ));
                })()}
                <div style={{marginTop:14,padding:"9px 13px",borderRadius:8,background:"rgba(74,158,107,0.12)",border:"1px solid rgba(74,158,107,0.3)",fontSize:12,color:"#4a9e6b",fontWeight:600}}>
                  Total codes: {summary.length}
                </div>
                <div style={{display:"flex",gap:8,marginTop:12}}>
                  <button onClick={doCopy} style={{flex:1,padding:"13px",borderRadius:9,border:"none",background:copied?"#16a34a":"linear-gradient(135deg,#7eb8c9,#4a6fa5)",color:"white",fontWeight:700,fontSize:13,cursor:"pointer"}}>
                    {copied?"✓ Copied!":"📋 Copy to Clipboard"}
                  </button>
                  <button onClick={doPrint} style={{flex:1,padding:"13px",borderRadius:9,border:"1px solid rgba(126,184,201,0.3)",background:"transparent",color:"#7eb8c9",fontWeight:700,fontSize:13,cursor:"pointer"}}>🖨 Print / PDF</button>
                </div>
                <button onClick={()=>setShowReset(true)} style={{width:"100%",marginTop:8,padding:"11px",borderRadius:9,border:"1px solid rgba(239,68,68,0.35)",background:"rgba(192,57,43,0.07)",color:"#c0392b",fontWeight:700,fontSize:12,cursor:"pointer"}}>
                  🗑 New Case — Clear Everything
                </button>
                {showReset&&(
                  <div style={{marginTop:8,padding:"12px",borderRadius:9,background:"rgba(192,57,43,0.12)",border:"1px solid rgba(192,57,43,0.35)",display:"flex",gap:8,alignItems:"center"}}>
                    <span style={{flex:1,fontSize:12,color:"#c0392b"}}>Clear all and start new case?</span>
                    <button onClick={newCase} style={{padding:"7px 14px",borderRadius:7,border:"none",background:"#c0392b",color:"white",fontWeight:700,fontSize:12,cursor:"pointer"}}>Yes, Reset</button>
                    <button onClick={()=>setShowReset(false)} style={{padding:"7px 14px",borderRadius:7,border:"1px solid rgba(255,255,255,0.04)",background:"transparent",color:"#9aa0a6",fontWeight:700,fontSize:12,cursor:"pointer"}}>Cancel</button>
                  </div>
                )}
              </>
            }
          </div>
        )}
      </div>

        {/* wRVU TAB */}
        {tab===5&&(
          <div>
            <div style={{background:"rgba(15,39,68,0.8)",border:"1px solid rgba(126,184,201,0.12)",borderRadius:9,padding:"10px 14px",marginBottom:14}}>
              <div style={{fontSize:11,color:"#6b7280"}}>2026 CMS Physician Fee Schedule — Work RVU values only (professional component)</div>
            </div>
            {summary.length===0
              ?<div style={{textAlign:"center",color:"#4b5563",padding:"40px 0",fontSize:13}}>No codes selected. Go back and select procedures.</div>
              :<>
                {(()=>{
                  const secs={};
                  summary.forEach(l=>{if(!secs[l.sec])secs[l.sec]=[];secs[l.sec].push(l);});
                  return Object.entries(secs).map(([s,ls])=>(
                    <div key={s}>
                      <div style={{fontSize:10,fontWeight:700,letterSpacing:"0.12em",textTransform:"uppercase",color:"#7eb8c9",padding:"14px 0 5px",borderBottom:"1px solid rgba(126,184,201,0.12)",marginBottom:7}}>{s}</div>
                      {ls.map((l,i)=>{
                        const rv=getWrvu(l.cpt);
                        const total=rv*(l.qty||1);
                        return(
                          <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 11px",marginBottom:3,borderRadius:7,background:"#0f172a",border:"1px solid #2a2a2a"}}>
                            <span style={{fontFamily:"monospace",fontSize:11,fontWeight:700,color:"#7eb8c9",minWidth:88,flexShrink:0}}>{l.cpt}{l.qty>1?" x"+l.qty:""}</span>
                            <span style={{fontSize:11,color:"#9aa0a6",flex:1}}>{l.desc.replace(/^\[.*?\] /,'')}</span>
                            <span style={{fontSize:13,fontWeight:700,color:rv===0?"#4b5563":"#7eb8c9",minWidth:44,textAlign:"right",flexShrink:0}}>
                              {rv===0?"—":total.toFixed(2)}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  ));
                })()}
                <div style={{marginTop:16,padding:"14px 16px",borderRadius:10,background:"linear-gradient(135deg,rgba(127,176,105,0.12),rgba(56,189,248,0.1))",border:"1px solid rgba(127,176,105,0.35)"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:14,fontWeight:700,color:"#e4e6eb"}}>Total wRVU — Case #{info.caseNum}</span>
                    <span style={{fontSize:24,fontWeight:800,color:"#7eb8c9"}}>{totalWrvu.toFixed(2)}</span>
                  </div>
                  <div style={{fontSize:11,color:"#6b7280",marginTop:4}}>Source: 2026 CMS PFS January Release — verify annually at cms.gov</div>
                </div>
              </>
            }
          </div>
        )}

      {/* COPYRIGHT FOOTER */}
      <div style={{textAlign:"center",padding:"20px 0 8px",fontSize:10,color:"#2a2a2a"}}>
        © 2026 Subhrajit Lahiri MD · All Rights Reserved
      </div>

      {/* FLOATING BAR */}
      {summary.length>0&&tab!==4&&(
        <div onClick={()=>setTab(4)} className="no-print" style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:680,background:"linear-gradient(135deg,#7eb8c9,#4a6fa5)",padding:"13px 20px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontWeight:700,fontSize:14,color:"#0f172a"}}>View Summary</span>
          <span style={{fontWeight:700,fontSize:14,color:"#0f172a"}}>{summary.length} codes →</span>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

  {id:"ivus_cor_add",group:"Coronary Interventions",label:"IVUS — Coronary, Each Additional",cpt:"92979",hasQty:true},
  {id:"impella",group:"Hemodynamic Support / ECMO",label:"Impella — Arterial Support",cpt:"33990"},
  {id:"impella_rem",group:"Hemodynamic Support / ECMO",label:"Impella — Removal",cpt:"33992"},
  {id:"ecmo_lt5",group:"Hemodynamic Support / ECMO",label:"Percutaneous ECMO Placement (less than or equal to 5 yrs)",cpt:"33951"},
  {id:"ecmo_gt6",group:"Hemodynamic Support / ECMO",label:"Percutaneous ECMO Placement (6 yrs and older)",cpt:"33952"},
  {id:"biopsy",group:"Other Procedures",label:"Endomyocardial Biopsy",cpt:"93505"},
  {id:"thermodilution",group:"Other Procedures",label:"Thermodilution Cardiac Output",cpt:"93598",hasQty:true},
  {id:"pharm_agent",group:"Other Procedures",label:"Pharmacologic Agent Administration with Hemodynamics (add-on)",cpt:"93463"},
  {id:"exercise_study",group:"Other Procedures",label:"Exercise Study with Hemodynamics (add-on)",cpt:"93464"},
  {id:"foreign_body",group:"Other Procedures",label:"Foreign Body Retrieval",cpt:"37197"},
  {id:"temp_atrial",group:"Other Procedures",label:"Temporary Pacemaker — Atrial",cpt:"93610-26"},
  {id:"temp_ventricular",group:"Other Procedures",label:"Temporary Pacemaker — Ventricular",cpt:"93612-26"},
  {id:"cardioversion",group:"Other Procedures",label:"Cardioversion, Elective, External",cpt:"92960"},
  {id:"cardiomems",group:"Other Procedures",label:"CardioMEMS Implant",cpt:"33289"},
  {id:"transfusion",group:"Other Procedures",label:"Transfusion — Blood or Blood Components",cpt:"36430"},
  {id:"pericardio_no_drain",group:"Centesis & Drains",label:"Pericardiocentesis — No Drain",cpt:"33016"},
  {id:"pericardio_drain_gt6",group:"Centesis & Drains",label:"Pericardiocentesis w/ Drain — greater than 6 yrs, no CHD",cpt:"33017"},
  {id:"pericardio_drain_lt5",group:"Centesis & Drains",label:"Pericardiocentesis w/ Drain — 5 yrs or less, or any CHD",cpt:"33018"},
  {id:"thoracentesis_no",group:"Centesis & Drains",label:"Thoracentesis — No Drain, No Imaging",cpt:"32554"},
  {id:"thoracentesis_img",group:"Centesis & Drains",label:"Thoracentesis — No Drain, With Imaging",cpt:"32555"},
  {id:"thoracentesis_drain",group:"Centesis & Drains",label:"Thoracentesis w/ Drain (incl imaging)",cpt:"32557"},
  {id:"ice",group:"Imaging",label:"ICE (Intracardiac Echo), add-on",cpt:"93662"},
  {id:"ivus_noncoronary",group:"Imaging",label:"IVUS — Non-coronary, Initial",cpt:"37252"},
  {id:"ivus_nc_add",group:"Imaging",label:"IVUS — Non-coronary, Each Additional",cpt:"37253",hasQty:true},
  {id:"fluoroscopy",group:"Imaging",label:"Fluoroscopy",cpt:"76000-26"},
  {id:"thrombectomy_art",group:"Thrombolysis / Thrombectomy",label:"Mechanical Thrombectomy — Arterial, Primary",cpt:"37184"},
  {id:"thrombectomy_art2",group:"Thrombolysis / Thrombectomy",label:"Mechanical Thrombectomy — Arterial, Each Additional",cpt:"37185",hasQty:true},
  {id:"thrombectomy_ven",group:"Thrombolysis / Thrombectomy",label:"Mechanical Thrombectomy — Venous, Initial",cpt:"37187"},
  {id:"thrombolysis_art",group:"Thrombolysis / Thrombectomy",label:"Arterial Thrombolysis (TPA) — Initial Day",cpt:"37211"},
  {id:"thrombolysis_ven",group:"Thrombolysis / Thrombectomy",label:"Venous Thrombolysis (TPA) — Initial Day",cpt:"37212"},
];

const ACCESS_CODES=[
  {id:"umbilical_art",label:"Umbilical Artery Catheter — Newborn",cpt:"36660"},
  {id:"umbilical_vein",label:"Umbilical Vein Catheter — Newborn",cpt:"36510"},
  {id:"art_puncture",label:"Arterial Puncture Only (blood sample)",cpt:"36600"},
  {id:"carotid_access",label:"Carotid / Vertebral Artery Vascular Access",cpt:"36100"},
  {id:"extremity_access",label:"Extremity / Axillary Artery Access",cpt:"36140"},
  {id:"art_line",label:"Arterial Line Placement",cpt:"36620"},
  {id:"cvl_lt5_no",label:"Central Venous Line — No Tunnel, less than 5 yrs",cpt:"36555"},
  {id:"cvl_gt5_no",label:"Central Venous Line — No Tunnel, 5 yrs or older",cpt:"36556"},
  {id:"cvl_lt5_tun",label:"Central Venous Line — Tunneled, less than 5 yrs",cpt:"36557"},
  {id:"cvl_gt5_tun",label:"Central Venous Line — Tunneled, 5 yrs or older",cpt:"36558"},
  {id:"cvl_fluoro",label:"Fluoroscopy Guidance for CVL (add-on)",cpt:"77001-26"},
  {id:"cvl_reposition",label:"CVL Repositioning (incl fluoro)",cpt:"36597"},
  {id:"picc_lt5",label:"PICC Line — less than 5 yrs",cpt:"36568"},
  {id:"picc_gt5",label:"PICC Line — 5 yrs or older",cpt:"36569"},
  {id:"picc_img_lt5",label:"PICC with Imaging — less than 5 yrs",cpt:"36572"},
  {id:"picc_img_gt5",label:"PICC with Imaging — 5 yrs or older",cpt:"36573"},
  {id:"picc_replace",label:"PICC Replacement",cpt:"36584"},
  {id:"tunneled_remove",label:"Removal of Tunneled Line",cpt:"36589"},
  {id:"us_access",label:"US-Guided Vascular Access (add-on)",cpt:"76937"},
  {id:"carotid_cutdown",label:"Carotid Cutdown",cpt:"36625"},
  {id:"carotid_repair",label:"Carotid Repair",cpt:"35201"},
];

const MODIFIERS=[
  {id:"mod_63",code:"63",label:"Infant less than 4 kg",note:"Weight must be listed in procedure note"},
  {id:"mod_22",code:"22",label:"Complex/Difficult Procedure",note:"Documentation must support increased complexity"},
  {id:"mod_80",code:"80",label:"Second Interventionalist",note:"2 separate operative notes required; list primary operator"},
];

const TABS=["Base Cath","Angios","Interventions","Access","Summary"];

function groupBy(arr,key){return arr.reduce((a,i)=>{const g=i[key]||"Other";if(!a[g])a[g]=[];a[g].push(i);return a;},{});}

const S={
  page:{minHeight:"100vh",background:"#0a1628",fontFamily:"'Segoe UI',system-ui,sans-serif",color:"#e2e8f0",maxWidth:680,margin:"0 auto"},
  hdr:{background:"linear-gradient(135deg,#0f2744 0%,#0a1628 100%)",padding:"18px 14px 0",borderBottom:"1px solid rgba(56,189,248,0.15)"},
  content:{padding:"12px 12px 80px"},
};

function QtyInput({value,onChange}){
  return <input type="number" min={1} max={20} value={value}
    onChange={e=>onChange(Math.max(1,parseInt(e.target.value)||1))}
    onClick={e=>e.stopPropagation()}
    style={{width:44,marginLeft:8,padding:"2px 6px",background:"#1e293b",border:"1px solid #38bdf8",color:"#38bdf8",borderRadius:4,fontSize:13,textAlign:"center"}}/>;
}

function ToggleRow({label,cpt,selected,onToggle,qty,onQtyChange,hasQty,note}){
  return(
    <div onClick={onToggle} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 12px",marginBottom:4,borderRadius:8,cursor:"pointer",userSelect:"none",
      background:selected?"rgba(56,189,248,0.12)":"rgba(255,255,255,0.03)",
      border:selected?"1px solid rgba(56,189,248,0.4)":"1px solid rgba(255,255,255,0.07)"}}>
      <div style={{width:20,height:20,borderRadius:4,flexShrink:0,marginTop:1,
        background:selected?"#38bdf8":"transparent",border:selected?"2px solid #38bdf8":"2px solid #475569",
        display:"flex",alignItems:"center",justifyContent:"center"}}>
        {selected&&<span style={{color:"#0f172a",fontSize:13,fontWeight:700}}>✓</span>}
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:"flex",alignItems:"center",flexWrap:"wrap",gap:6}}>
          <span style={{fontSize:13,color:selected?"#e2e8f0":"#94a3b8",lineHeight:1.4}}>{label}</span>
          {hasQty&&selected&&<QtyInput value={qty||1} onChange={onQtyChange}/>}
        </div>
        {cpt&&<div style={{fontSize:11,color:"#38bdf8",marginTop:2,fontFamily:"monospace"}}>{cpt}</div>}
        {note&&selected&&<div style={{fontSize:11,color:"#f59e0b",marginTop:3}}>⚠ {note}</div>}
      </div>
    </div>
  );
}

function ClinicalButton({btn,selected,onToggle,quantities,onQtyChange}){
  return(
    <div onClick={()=>onToggle(btn.id)} style={{padding:"11px 13px",borderRadius:10,marginBottom:5,cursor:"pointer",userSelect:"none",
      background:selected?"rgba(56,189,248,0.15)":"rgba(255,255,255,0.03)",
      border:selected?"1px solid rgba(56,189,248,0.5)":"1px solid rgba(255,255,255,0.08)"}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:21,height:21,borderRadius:5,flexShrink:0,background:selected?"#38bdf8":"transparent",
          border:selected?"2px solid #38bdf8":"2px solid #475569",display:"flex",alignItems:"center",justifyContent:"center"}}>
          {selected&&<span style={{color:"#0f172a",fontSize:13,fontWeight:700}}>✓</span>}
        </div>
        <span style={{fontSize:13,fontWeight:600,color:selected?"#e2e8f0":"#94a3b8"}}>{btn.label}</span>
      </div>
      {selected&&(
        <div style={{marginTop:8,paddingLeft:31}}>
          {btn.codes.map((c,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
              <span style={{fontFamily:"monospace",fontSize:11,color:"#38bdf8",minWidth:78}}>{c.cpt}</span>
              <span style={{fontSize:11,color:"#64748b",flex:1}}>{c.desc}</span>
              {c.hasQty&&<QtyInput value={quantities[btn.id+"_"+i]||c.qty||1} onChange={v=>onQtyChange(btn.id+"_"+i,v)}/>}
              {!c.hasQty&&c.qty>1&&<span style={{fontSize:11,color:"#f59e0b"}}>x{c.qty}</span>}
            </div>
          ))}
          {btn.note&&<div style={{fontSize:11,color:"#f59e0b",marginTop:4}}>⚠ {btn.note}</div>}
        </div>
      )}
    </div>
  );
}

function SecHead({title,onClear,count}){
  return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 0 5px",borderBottom:"1px solid rgba(56,189,248,0.2)",marginBottom:7}}>
      <span style={{fontSize:10,fontWeight:700,letterSpacing:"0.12em",textTransform:"uppercase",color:"#38bdf8"}}>
        {title}{count>0&&<span style={{marginLeft:6,background:"rgba(56,189,248,0.2)",color:"#38bdf8",borderRadius:8,fontSize:9,padding:"1px 5px"}}>{count}</span>}
      </span>
      {onClear&&count>0&&(
        <button onClick={e=>{e.stopPropagation();onClear();}}
          style={{fontSize:10,color:"#ef4444",background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:5,padding:"2px 8px",cursor:"pointer",fontWeight:600}}>
          CLEAR
        </button>
      )}
    </div>
  );
}

function ClearAllBar({onClear}){
  return(
    <button onClick={onClear} style={{width:"100%",padding:"11px",marginBottom:14,borderRadius:8,
      border:"1px solid rgba(239,68,68,0.4)",background:"rgba(239,68,68,0.08)",
      color:"#ef4444",fontWeight:700,fontSize:12,cursor:"pointer"}}>
      🗑 CLEAR ALL SELECTIONS IN THIS TAB
    </button>
  );
}

function App(){
  const [tab,setTab]=useState(0);
  const [info,setInfo]=useState({date:"",provider:"",caseNum:"1"});
  const [selBase,setSelBase]=useState(new Set());
  const [selAngios,setSelAngios]=useState(new Set());
  const [selInt,setSelInt]=useState(new Set());
  const [selAccess,setSelAccess]=useState(new Set());
  const [selMods,setSelMods]=useState(new Set());
  const [qty,setQty]=useState({});
  const [showReset,setShowReset]=useState(false);
  const [intSearch,setIntSearch]=useState("");
  const [copied,setCopied]=useState(false);

  const tog=(fn,id)=>fn(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n;});
  const getQ=(k,d=1)=>qty[k]||d;
  const setQ=(k,v)=>setQty(p=>({...p,[k]:v}));

  const clearAngioGroup=(group)=>{
    const ids=ANGIO_BUTTONS.filter(b=>b.group===group).map(b=>b.id);
    setSelAngios(prev=>{const n=new Set(prev);ids.forEach(id=>n.delete(id));return n;});
  };
  const clearIntGroup=(group)=>{
    const ids=INTERVENTIONS.filter(c=>c.group===group).map(c=>c.id);
    setSelInt(prev=>{const n=new Set(prev);ids.forEach(id=>n.delete(id));return n;});
  };
  const newCase=()=>{
    setSelBase(new Set());setSelAngios(new Set());setSelInt(new Set());
    setSelAccess(new Set());setSelMods(new Set());setQty({});
    setInfo({date:"",provider:"",caseNum:"1"});setShowReset(false);setTab(0);
  };

  const buildSummary=()=>{
    const lines=[];
    BASE_CODES.filter(c=>selBase.has(c.id)).forEach(c=>lines.push({cpt:c.cpt,desc:c.label,qty:1,sec:"Base Catheterization"}));
    ANGIO_BUTTONS.filter(b=>selAngios.has(b.id)).forEach(b=>{
      b.codes.forEach((c,i)=>{
        const q=c.hasQty?getQ(b.id+"_"+i,c.qty||1):(c.qty||1);
        lines.push({cpt:c.cpt,desc:"["+b.label+"] "+c.desc,qty:q,sec:"Angiography"});
      });
    });
    INTERVENTIONS.filter(c=>selInt.has(c.id)).forEach(c=>lines.push({cpt:c.cpt,desc:c.label,qty:c.hasQty?getQ(c.id):1,sec:c.group}));
    ACCESS_CODES.filter(c=>selAccess.has(c.id)).forEach(c=>lines.push({cpt:c.cpt,desc:c.label,qty:1,sec:"Vascular Access"}));
    return lines;
  };

  const summary=buildSummary();
  const activeMods=MODIFIERS.filter(m=>selMods.has(m.id));
  const angiGroups=groupBy(ANGIO_BUTTONS,"group");
  const intGroups=groupBy(INTERVENTIONS,"group");
  const badge=i=>[selBase.size,selAngios.size,selInt.size,selAccess.size,summary.length][i]||0;

  const doCopy=()=>{
    const hdr="CARDIAC CATH CHARGE CAPTURE\n"+"-".repeat(48)+"\nDate: "+(info.date||"___")+"  |  Provider: "+(info.provider||"___")+"  |  Case #"+info.caseNum+"\n"+"-".repeat(48)+"\n";
    const mLine=activeMods.length?"\nMODIFIERS: "+activeMods.map(m=>"-"+m.code+" ("+m.label+")").join(", ")+"\n":"";
    const secs={};
    summary.forEach(l=>{if(!secs[l.sec])secs[l.sec]=[];secs[l.sec].push("  "+l.cpt+(l.qty>1?" x"+l.qty:"")+"  |  "+l.desc);});
    const body=Object.entries(secs).map(([s,ls])=>"\n"+s.toUpperCase()+"\n"+ls.join("\n")).join("\n");
    const text=hdr+mLine+body+"\n\n"+"-".repeat(48)+"\nTOTAL CODES: "+summary.length;
    navigator.clipboard.writeText(text).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
  };

  return(
    <div style={S.page}>
      {/* HEADER */}
      <div style={S.hdr}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
          <div style={{width:34,height:34,borderRadius:8,background:"linear-gradient(135deg,#0ea5e9,#6366f1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,flexShrink:0}}>❤</div>
          <div style={{flex:1}}>
            <div style={{fontSize:15,fontWeight:700}}>Cath Lab Charge Capture</div>
            <div style={{fontSize:10,color:"#64748b"}}>Congenital / Pediatric Cardiac Catheterization</div>
          </div>
          {!showReset
            ?<button onClick={()=>setShowReset(true)} style={{fontSize:11,color:"#f59e0b",background:"rgba(245,158,11,0.1)",border:"1px solid rgba(245,158,11,0.3)",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontWeight:700,whiteSpace:"nowrap"}}>+ New Case</button>
            :<div style={{display:"flex",gap:6}}>
              <button onClick={newCase} style={{fontSize:11,color:"white",background:"#ef4444",border:"none",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontWeight:700}}>Confirm Reset</button>
              <button onClick={()=>setShowReset(false)} style={{fontSize:11,color:"#94a3b8",background:"rgba(255,255,255,0.08)",border:"none",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontWeight:700}}>Cancel</button>
            </div>
          }
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 80px",gap:6,marginBottom:12}}>
          {[["date","Procedure Date"],["provider","Provider"]].map(([f,ph])=>(
            <input key={f} placeholder={ph} value={info[f]} onChange={e=>setInfo(p=>({...p,[f]:e.target.value}))}
              style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:6,padding:"7px 10px",color:"#e2e8f0",fontSize:12,outline:"none"}}/>
          ))}
          <select value={info.caseNum} onChange={e=>setInfo(p=>({...p,caseNum:e.target.value}))}
            style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:6,padding:"7px 8px",color:"#e2e8f0",fontSize:12,outline:"none"}}>
            <option value="1">Case 1</option>
            <option value="2">Case 2</option>
          </select>
        </div>
        <div style={{display:"flex",gap:1,overflowX:"auto"}}>
          {TABS.map((t,i)=>{
            const b=badge(i);
            return(
              <button key={t} onClick={()=>setTab(i)} style={{padding:"7px 11px",fontSize:11,fontWeight:600,border:"none",borderRadius:"6px 6px 0 0",cursor:"pointer",whiteSpace:"nowrap",
                background:tab===i?"#0a1628":"transparent",color:tab===i?"#38bdf8":"#64748b",
                borderBottom:tab===i?"2px solid #38bdf8":"2px solid transparent"}}>
                {t}{b>0&&<span style={{marginLeft:4,background:i===4?"#22c55e":"#38bdf8",color:"#0a1628",borderRadius:10,fontSize:9,fontWeight:700,padding:"1px 4px"}}>{b}</span>}
              </button>
            );
          })}
        </div>
      </div>

      <div style={S.content}>

        {/* BASE CATH */}
        {tab===0&&(
          <div>
            {(selBase.size>0||selMods.size>0)&&<ClearAllBar onClear={()=>{setSelBase(new Set());setSelMods(new Set());}}/>}
            <SecHead title="Base Catheterization Code (select one)" onClear={()=>setSelBase(new Set())} count={selBase.size}/>
            <div style={{fontSize:11,color:"#64748b",marginBottom:8}}>This anchors all add-on angiography codes.</div>
            {BASE_CODES.map(c=><ToggleRow key={c.id} label={c.label} cpt={c.cpt} selected={selBase.has(c.id)} onToggle={()=>tog(setSelBase,c.id)}/>)}
            <SecHead title="Modifiers" onClear={()=>setSelMods(new Set())} count={selMods.size}/>
            <div style={{fontSize:11,color:"#64748b",marginBottom:8}}>Apply to relevant codes in summary.</div>
            {MODIFIERS.map(m=><ToggleRow key={m.id} label={"Modifier -"+m.code+" — "+m.label} note={m.note} cpt={"-"+m.code} selected={selMods.has(m.id)} onToggle={()=>tog(setSelMods,m.id)}/>)}
          </div>
        )}

        {/* ANGIOS */}
        {tab===1&&(
          <div>
            <div style={{fontSize:11,color:"#64748b",marginBottom:10}}>Each button auto-selects catheter placement + S&I. -26 modifier pre-applied to all S&I codes.</div>
            {selAngios.size>0&&<ClearAllBar onClear={()=>setSelAngios(new Set())}/>}
            {Object.entries(angiGroups).map(([g,btns])=>{
              const gc=btns.filter(b=>selAngios.has(b.id)).length;
              return(
                <div key={g}>
                  <SecHead title={g} onClear={()=>clearAngioGroup(g)} count={gc}/>
                  {btns.map(btn=><ClinicalButton key={btn.id} btn={btn} selected={selAngios.has(btn.id)} onToggle={id=>tog(setSelAngios,id)} quantities={qty} onQtyChange={setQ}/>)}
                </div>
              );
            })}
          </div>
        )}

        {/* INTERVENTIONS */}
        {tab===2&&(
          <div>
            <div style={{position:"sticky",top:0,zIndex:10,background:"#0a1628",paddingBottom:10,paddingTop:4}}>
              <div style={{position:"relative"}}>
                <span style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",fontSize:14,color:"#475569",pointerEvents:"none"}}>🔍</span>
                <input placeholder="Search interventions... (e.g. PA stent, coarc, ASD)" value={intSearch} onChange={e=>setIntSearch(e.target.value)}
                  style={{width:"100%",boxSizing:"border-box",padding:"10px 36px 10px 34px",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(56,189,248,0.3)",borderRadius:9,color:"#e2e8f0",fontSize:13,outline:"none"}}/>
                {intSearch&&<button onClick={()=>setIntSearch("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#64748b",fontSize:16,cursor:"pointer",padding:0}}>✕</button>}
              </div>
              {intSearch&&<div style={{fontSize:10,color:"#64748b",marginTop:4,paddingLeft:2}}>{INTERVENTIONS.filter(c=>(c.label+c.cpt+c.group).toLowerCase().includes(intSearch.toLowerCase())).length} results</div>}
            </div>
            {selInt.size>0&&!intSearch&&<ClearAllBar onClear={()=>setSelInt(new Set())}/>}
            {intSearch?(()=>{
              const q=intSearch.toLowerCase();
              const results=INTERVENTIONS.filter(c=>(c.label+c.cpt+c.group).toLowerCase().includes(q));
              if(!results.length) return <div style={{textAlign:"center",color:"#475569",padding:"30px 0",fontSize:13}}>No results for "{intSearch}"</div>;
              return results.map(c=>(
                <div key={c.id}>
                  <div style={{fontSize:9,color:"#475569",marginBottom:2,paddingLeft:2,letterSpacing:"0.08em",textTransform:"uppercase"}}>{c.group}</div>
                  <ToggleRow label={c.label} cpt={c.cpt} selected={selInt.has(c.id)} onToggle={()=>tog(setSelInt,c.id)} hasQty={c.hasQty} qty={getQ(c.id)} onQtyChange={v=>setQ(c.id,v)}/>
                </div>
              ));
            })()
            :Object.entries(intGroups).map(([g,items])=>{
              const gc=items.filter(c=>selInt.has(c.id)).length;
              return(
                <div key={g}>
                  <SecHead title={g} onClear={()=>clearIntGroup(g)} count={gc}/>
                  {items.map(c=><ToggleRow key={c.id} label={c.label} cpt={c.cpt} selected={selInt.has(c.id)} onToggle={()=>tog(setSelInt,c.id)} hasQty={c.hasQty} qty={getQ(c.id)} onQtyChange={v=>setQ(c.id,v)}/>)}
                </div>
              );
            })}
          </div>
        )}

        {/* ACCESS */}
        {tab===3&&(
          <div>
            {selAccess.size>0&&<ClearAllBar onClear={()=>setSelAccess(new Set())}/>}
            <SecHead title="Vascular Access" onClear={()=>setSelAccess(new Set())} count={selAccess.size}/>
            {ACCESS_CODES.map(c=><ToggleRow key={c.id} label={c.label} cpt={c.cpt} selected={selAccess.has(c.id)} onToggle={()=>tog(setSelAccess,c.id)}/>)}
          </div>
        )}

        {/* SUMMARY */}
        {tab===4&&(
          <div>
            {summary.length===0
              ?<div style={{textAlign:"center",color:"#475569",padding:"40px 0",fontSize:13}}>No codes selected. Go back and select procedures.</div>
              :<>
                <div style={{background:"rgba(15,39,68,0.8)",border:"1px solid rgba(56,189,248,0.2)",borderRadius:9,padding:"10px 14px",marginBottom:12}}>
                  <div style={{fontSize:11,color:"#64748b"}}>Date: <span style={{color:"#e2e8f0"}}>{info.date||"—"}</span> &nbsp;|&nbsp; Provider: <span style={{color:"#e2e8f0"}}>{info.provider||"—"}</span> &nbsp;|&nbsp; Case <span style={{color:"#e2e8f0"}}>#{info.caseNum}</span></div>
                </div>
                {activeMods.length>0&&(
                  <div style={{background:"rgba(245,158,11,0.1)",border:"1px solid rgba(245,158,11,0.3)",borderRadius:8,padding:"9px 13px",marginBottom:10}}>
                    <div style={{fontSize:10,fontWeight:700,color:"#f59e0b",marginBottom:3}}>MODIFIERS APPLIED</div>
                    {activeMods.map(m=><div key={m.id} style={{fontSize:12,color:"#fcd34d"}}>-{m.code} {m.label} — <span style={{color:"#92400e"}}>{m.note}</span></div>)}
                  </div>
                )}
                {(()=>{
                  const secs={};
                  summary.forEach(l=>{if(!secs[l.sec])secs[l.sec]=[];secs[l.sec].push(l);});
                  return Object.entries(secs).map(([s,ls])=>(
                    <div key={s}>
                      <SecHead title={s}/>
                      {ls.map((l,i)=>(
                        <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 11px",marginBottom:3,borderRadius:7,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.07)"}}>
                          <span style={{fontFamily:"monospace",fontSize:12,fontWeight:700,color:"#38bdf8",minWidth:88}}>{l.cpt}{l.qty>1?" x"+l.qty:""}</span>
                          <span style={{fontSize:11,color:"#94a3b8",flex:1}}>{l.desc}</span>
                        </div>
                      ))}
                    </div>
                  ));
                })()}
                <div style={{marginTop:14,padding:"9px 13px",borderRadius:8,background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.3)",fontSize:12,color:"#86efac",fontWeight:600}}>
                  Total codes: {summary.length}
                </div>
                <div style={{display:"flex",gap:8,marginTop:12}}>
                  <button onClick={doCopy} style={{flex:1,padding:"13px",borderRadius:9,border:"none",background:copied?"#16a34a":"linear-gradient(135deg,#0ea5e9,#6366f1)",color:"white",fontWeight:700,fontSize:13,cursor:"pointer"}}>
                    {copied?"✓ Copied!":"📋 Copy to Clipboard"}
                  </button>
                  <button onClick={()=>window.print()} style={{flex:1,padding:"13px",borderRadius:9,border:"1px solid rgba(56,189,248,0.4)",background:"transparent",color:"#38bdf8",fontWeight:700,fontSize:13,cursor:"pointer"}}>🖨 Print / PDF</button>
                </div>
                <button onClick={()=>setShowReset(true)} style={{width:"100%",marginTop:8,padding:"11px",borderRadius:9,border:"1px solid rgba(239,68,68,0.35)",background:"rgba(239,68,68,0.07)",color:"#ef4444",fontWeight:700,fontSize:12,cursor:"pointer"}}>
                  🗑 New Case — Clear Everything
                </button>
                {showReset&&(
                  <div style={{marginTop:8,padding:"12px",borderRadius:9,background:"rgba(239,68,68,0.12)",border:"1px solid rgba(239,68,68,0.4)",display:"flex",gap:8,alignItems:"center"}}>
                    <span style={{flex:1,fontSize:12,color:"#fca5a5"}}>Clear all and start new case?</span>
                    <button onClick={newCase} style={{padding:"7px 14px",borderRadius:7,border:"none",background:"#ef4444",color:"white",fontWeight:700,fontSize:12,cursor:"pointer"}}>Yes, Reset</button>
                    <button onClick={()=>setShowReset(false)} style={{padding:"7px 14px",borderRadius:7,border:"1px solid rgba(255,255,255,0.15)",background:"transparent",color:"#94a3b8",fontWeight:700,fontSize:12,cursor:"pointer"}}>Cancel</button>
                  </div>
                )}
              </>
            }
          </div>
        )}
      </div>

      {/* FLOATING BAR */}
      {summary.length>0&&tab!==4&&(
        <div onClick={()=>setTab(4)} className="no-print" style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:680,background:"linear-gradient(135deg,#0ea5e9,#6366f1)",padding:"13px 20px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontWeight:700,fontSize:14}}>View Summary</span>
          <span style={{fontWeight:700,fontSize:14}}>{summary.length} codes →</span>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
